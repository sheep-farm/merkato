[package]
name = "merkato"
version = "0.3.0"
edition = "2021"
authors = ["Flávio de Vasconcellos Corrêa"]
license = "GPL-3.0-or-later"
description = "A modern financial market tracker for GNOME"
homepage = "https://github.com/sheep-farm/merkato"
repository = "https://github.com/sheep-farm/merkato"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
gdk4 = "0.11.0"
gtk4 = "0.11.0"
gtk4-sys = "0.11.0"
glib = { version = "0.22.0", features = ["v2_76"] }
gio = { version = "0.22.1", features = ["v2_76"] }
cairo-rs = { version = "0.22.0", features = ["use_glib"] }
pango = "0.22.0"
pangocairo = "0.22.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "^0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
async-channel = "2.5.0"

[profile.dev]
# Fast compilation, usable performance
opt-level = 1              # Basic optimizations
debug = true               # Full debug info
incremental = true         # Faster recompilation

[profile.release]
# Maximum performance
opt-level = 3              # Maximum optimizations
lto = "thin"               # Link-time optimization (thin = good balance)
codegen-units = 1          # Single codegen unit for better optimization
strip = true               # Strip symbols (smaller binary)
debug = false              # No debug info
panic = "abort"            # Smaller binary, no unwind tables

[profile.release-small]
# Optimized for binary size (use with: cargo build --profile release-small)
inherits = "release"
opt-level = "z"            # Optimize for size
lto = true                 # Full LTO for size reduction
codegen-units = 1
